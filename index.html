const av=(u,n,c='')=>u?`<img class="av ${c}" src="${esc(u)}" alt="${esc(n)}">`:`<div class="av ${c}">${esc((n||'?')[0])}</div>`;
async function saveSet(p){S.set={...S.set,...p};await db.doc('site/main').set(S.set)}
function theme(){const r=document.documentElement.style;r.setProperty('--g',S.set.color);r.setProperty('--gr',S.set.gray);document.documentElement.lang=L}
function setL(l){L=l;CH=l;try{localStorage.setItem('dks_lang',l)}catch(e){}render()}
function go(p){pg=p;mopen=false;res=null;scrollTo(0,0);render()}

 const P=[['home','n_home'],['about','n_about'],['leaders','n_leaders'],['members','n_db'],['gallery','n_gallery'],['news','n_news'],['contact','n_contact']];
 $('#nav').innerHTML=`<div class="brand" onclick="go('home')">${S.set.logo?`<img class="logo" src="${esc(S.set.logo)}" alt="logo">`:'<div class="logo">DK</div>'}<span>${esc(t('brand'))}</span></div><button class="burger" onclick="mopen=!mopen;render()" aria-label="menu">☰</button>
 <div class="links ${mopen?'open':''}">${P.map(([p,k])=>`<a class="${pg==p?'on':''}" onclick="go('${p}')">${esc(t(k))}</a>`).join('')}${ed?`<a class="${pg=='admin'?'on':''}" onclick="go('admin')">⚙ ${esc(t('n_admin'))}</a>`:''}
 <div class="lang">${[['en','EN'],['hi','हिं'],['or','ଓ']].map(([l,n])=>`<button class="chip ${L==l?'on':''}" onclick="setL('${l}')">${n}</button>`).join('')}</div></div>`;
 const v={home,about,leaders,members,gallery,news,contact,admin}[pg]||home;$('#app').innerHTML=v();
 const s=S.set,so=[['fb','Facebook'],['yt','YouTube'],['wa','WhatsApp'],['ig','Instagram']].filter(x=>s[x[0]]).map(x=>`<a href="${esc(s[x[0]])}" target="_blank" rel="noopener">${x[1]}</a>`).join('');
 $('#foot').innerHTML=`<div class="soc">${so}</div><div><b>${esc(t('ql'))}:</b> ${P.map(([p,k])=>`<a onclick="go('${p}')">${esc(t(k))}</a>`).join('')}<a onclick="go('contact')">${esc(t('n_inquiry'))}</a></div><p>© ${new Date().getFullYear()} ${esc(t('brand'))}. ${esc(t('rights'))}</p>`}
const newsCard=n=>`<div class="card"><div class="date">${fmt(n.ts)}</div><h3>${esc(m(n,'title'))}</h3><div>${esc(m(n,'body')).replace(/\n/g,'<br>')}</div></div>`;
function home(){const s=S.set;return `<div class="hero" style="${s.hero?`background-image:linear-gradient(rgba(20,50,30,.6),rgba(20,50,30,.6)),url('${esc(s.hero)}')`:''}"><span class="badge">${esc(t('badge'))}</span><h1>${esc(t('h_title'))}</h1><p>${esc(t('h_sub'))}</p>
 <div class="btns">${[['about','n_about'],['gallery','n_gallery'],['contact','n_contact'],['members','n_db'],['contact','n_inquiry']].map(([p,k],i)=>`<button class="btn ${i?'w':'w'}" onclick="go('${p}')">${esc(t(k))}</button>`).join('')}</div></div>
 <h2 class="t">${esc(t('v_t'))}</h2><div class="grid">${['v1','v2','v3'].map(k=>`<div class="card"><h3>${esc(t(k))}</h3><p>${esc(t(k+'d'))}</p></div>`).join('')}</div>
 <h2 class="t">${esc(t('latest'))}</h2><div class="grid">${S.news.slice(0,3).map(newsCard).join('')||`<p>${esc(t('nw_none'))}</p>`}</div><p><a href="#" onclick="go('news');return false">${esc(t('more'))} →</a></p>`}
const about=()=>`<h2 class="t">${esc(t('a_t'))}</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${[['hist_t','hist'],['mis_t','mis'],['vis_t','vis'],['trad_t','trad']].map(([a,b])=>`<div class="card"><h3>${esc(t(a))}</h3><p>${esc(t(b))}</p></div>`).join('')}</div>`;
const leaders=()=>`<h2 class="t">${esc(t('l_t'))}</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${S.set.leaders.map(l=>`<div class="card"><div class="ph">${av(l.photo,l.name,'big')}<div><h3>${esc(m(l,'name'))}</h3><b class="ok">${esc(m(l,'role'))}</b></div></div><p>“${esc(m(l,'msg'))}”</p></div>`).join('')||`<p>${esc(t('l_none'))}</p>`}</div>`;
function members(){const r=res;return `<h2 class="t">${esc(t('m_t'))}</h2><div class="card" style="max-width:560px"><p>${esc(t('m_sub'))}</p><label>${esc(t('m_name'))}</label><input id="qn" autocomplete="off"><label>${esc(t('m_code'))}</label><input id="qc" inputmode="numeric" maxlength="4" autocomplete="off"><button class="btn" onclick="find()">${esc(t('m_go'))}</button></div>
 ${r===0?`<p class="err">${esc(t('m_none'))}</p>`:r?`<div class="card" style="max-width:560px;margin-top:16px"><div class="ph">${av(r.photo,r.name,'big')}<div><h3>${esc(r.name)}</h3><div><small class="h">${esc(t(r.relType=='husband'?'m_h':'m_f'))}</small><br><b>${esc(r.rel)}</b></div></div></div><p><small class="h">${esc(t('addr'))}</small><br>${esc(r.address)}</p></div>`:''}`}
async function find(){const n=g('qn').toLowerCase().replace(/\s+/g,' '),c=g('qc');if(!n||!/^\d{4}$/.test(c)){res=0;return render()}
 try{const q=await db.collection('members').where('code','==',c).get();const d=q.docs.map(x=>x.data()).find(x=>x.name.trim().toLowerCase().replace(/\s+/g,' ')==n);res=d||0}catch(e){res=0}render()}
function gallery(){const cs=[...new Set(S.gal.map(x=>x.cat).filter(Boolean))],l=S.gal.filter(x=>!cat||x.cat==cat);
 return `<h2 class="t">${esc(t('g_t'))}</h2><div class="tabs"><button class="chip ${!cat?'on':''}" onclick="cat='';render()">${esc(t('g_all'))}</button>${cs.map(c=>`<button class="chip ${cat==c?'on':''}" onclick="cat='${esc(c).replace(/'/g,'')}';render()">${esc(c)}</button>`).join('')}</div>
 <div class="grid gal">${l.map(x=>`<div><img loading="lazy" src="${esc(x.url)}" alt="${esc(m(x,'cap'))}" onclick="lb(this.src)"><div class="cap">${esc(m(x,'cap'))}</div></div>`).join('')||`<p>${esc(t('g_none'))}</p>`}</div>`}
function lb(u){const d=document.createElement('div');d.className='lb';d.onclick=()=>d.remove();d.innerHTML=`<img src="${esc(u)}" alt="">`;document.body.append(d)}
const news=()=>`<h2 class="t">${esc(t('nw_t'))}</h2><div class="grid" style="grid-template-columns:1fr">${S.news.map(newsCard).join('')||`<p>${esc(t('nw_none'))}</p>`}</div>`;
function contact(){const s=S.set;return `<h2 class="t">${esc(t('c_t'))}</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card">
 ${s.phone?`<p>📞 <b>${esc(t('phone'))}:</b> <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></p>`:''}${s.email?`<p>✉ <b>${esc(t('email'))}:</b> <a href="mailto:${esc(s.email)}">${esc(s.email)}</a></p>`:''}${s.address?`<p>📍 <b>${esc(t('addr'))}:</b> ${esc(s.address)}</p>`:''}
 <div class="btns">${s.map?`<a class="btn gr" href="${esc(s.map)}" target="_blank" rel="noopener">${esc(t('map'))}</a>`:''}${s.form?`<a class="btn" href="${esc(s.form)}" target="_blank" rel="noopener">${esc(t('form'))}</a>`:''}</div></div>
 <div class="card"><h3>${esc(t('c_inq'))}</h3><label>${esc(t('c_name'))}</label><input id="in"><label>${esc(t('c_mob'))}</label><input id="im" inputmode="tel"><label>${esc(t('c_msg'))}</label><textarea id="ig" rows="4"></textarea><button class="btn" onclick="sendInq()">${esc(t('c_send'))}</button></div></div>`}
async function sendInq(){const o={name:g('in'),mobile:g('im'),msg:g('ig'),ts:new Date().toISOString()};if(!o.name||!o.msg)return toast(t('c_err'));
 try{await db.collection('inquiries').add(o);toast(t('c_ok'));go('contact')}catch(e){toast(t('c_err'))}}
/* ---------- ADMIN ---------- */
const TABS=[['members','Members'],['news','News'],['gallery','Gallery'],['leaders','Leaders'],['texts','Texts'],['design','Design & Contact'],['inq','Inquiries'],['data','Data'],['sec','Password']];
const I=(id,l,v='',ty='text')=>`<label>${l}</label><input id="${id}" type="${ty}" value="${esc(v)}">`;
const ML=(id,l,o={},k,ta)=>`<div class="two">${LG.map((x,i)=>{const kk=x=='en'?k:k+'_'+x,v=esc(o[kk]||''),n=['English','हिन्दी','ଓଡ଼ିଆ'][i];return `<div><label>${l} (${n})</label>${ta?`<textarea id="${id}_${x}" rows="3">${v}</textarea>`:`<input id="${id}_${x}" value="${v}">`}</div>`}).join('')}</div>`;
const RD=(id,k,o)=>LG.forEach(x=>o[x=='en'?k:k+'_'+x]=g(id+'_'+x));
function admin(){if(!ed)return '<p>—</p>';if(!unl)return `<div class="card" style="max-width:420px;margin:auto"><h3>🔒 Admin login</h3>${I('pw','Admin password','','password')}<button class="btn" onclick="login()">Unlock</button><p class="cap">First-time password: <b>admin123</b>. Change it in the Password tab.</p></div>`;
 return `<div class="tabs">${TABS.map(([k,n])=>`<button class="chip ${tab==k?'on':''}" onclick="tab='${k}';eid=null;render()">${n}</button>`).join('')}</div><div class="card">${AT[tab]()}</div>`}
async function login(){let h=await sha('admin123');try{const d=await db.doc('secure/admin').get();if(d.exists)h=d.data().h}catch(e){}
 if(await sha(g('pw'))==h){unl=true;render()}else toast('Wrong password')}
const del=async(c,id)=>{if(confirm('Delete?')){await db.collection(c).doc(id).delete();toast('Deleted')}};
const lst=(arr,f)=>arr.map((x,i)=>`<div class="row"><div>${f(x)}</div><div><button class="btn sm gr" onclick="eid='${x.id??i}';render()">Edit</button> <button class="btn sm rd" onclick="${x.id?`del('${x.cid}','${x.id}')`:`delL(${i})`}">Delete</button></div></div>`).join('');
const AT={
members(){const e=S.members.find(x=>x.id==eid)||{};return `<h3>${eid?'Edit':'Add'} member</h3><div class="two"><div>${I('mn','Name',e.name)}</div><div><label>Relation</label><select id="mt"><option value="father">Father's name</option><option value="husband" ${e.relType=='husband'?'selected':''}>Husband's name</option></select></div><div>${I('mr','Father / Husband name',e.rel)}</div><div>${I('mc','Unique 4-digit code',e.code||'','text')}<button class="btn sm gr" onclick="$('#mc').value=gen()">Auto-generate</button></div></div>${I('ma','Address',e.address)}<label>Photo ${e.photo?'(leave empty to keep current)':''}</label><input id="mp" type="file" accept="image/*"><button class="btn" onclick="saveMem()">Save member</button> ${eid?'<button class="btn gr" onclick="eid=null;render()">Cancel</button>':''}
 <h3 style="margin-top:24px">Members (${S.members.length})</h3>${lst(S.members.map(x=>({...x,cid:'members'})),x=>`<div class="ph">${av(x.photo,x.name)}<span><b>${esc(x.name)}</b> · <code>${esc(x.code)}</code><br><small class="h">${esc(x.rel)}</small></span></div>`)}`},
news(){const e=S.news.find(x=>x.id==eid)||{};return `<h3>${eid?'Edit':'Post'} update</h3>${ML('nt','Title',e,'title')}${ML('nb','Details',e,'body',1)}<button class="btn" onclick="saveNews()">Publish</button>${eid?' <button class="btn gr" onclick="eid=null;render()">Cancel</button>':''}<h3 style="margin-top:24px">Posted</h3>${lst(S.news.map(x=>({...x,cid:'news'})),x=>`<b>${esc(x.title)}</b><br><small class="h">${fmt(x.ts)}</small>`)}`},
gallery(){const cs=S.set.cats.split(',').map(x=>x.trim()).filter(Boolean);return `<h3>Upload photos</h3><label>Category</label><input id="gc" list="cl" value="${esc(cs[0]||'')}"><datalist id="cl">${cs.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist>${ML('gp','Caption',{},'cap')}<label>Photos (select many)</label><input id="gf" type="file" accept="image/*" multiple><button class="btn" onclick="saveGal()">Upload</button><h3 style="margin-top:24px">Photos (${S.gal.length})</h3><div class="grid gal">${S.gal.map(x=>`<div><img src="${esc(x.url)}" alt=""><div class="cap">${esc(x.cat)} · ${esc(x.cap)}</div><button class="btn sm rd" onclick="del('gallery','${x.id}')">Delete</button></div>`).join('')}</div>`},
leaders(){const e=S.set.leaders[eid]||{};return `<h3>${eid!=null?'Edit':'Add'} leader</h3>${ML('ln','Name',e,'name')}${ML('lr','Designation',e,'role')}${ML('lm','Message',e,'msg',1)}<label>Photo</label><input id="lp" type="file" accept="image/*"><button class="btn" onclick="saveL()">Save leader</button><h3 style="margin-top:24px">Leaders</h3>${lst(S.set.leaders,x=>`<div class="ph">${av(x.photo,x.name)}<b>${esc(x.name)}</b> · ${esc(x.role)}</div>`)}`},
texts(){return `<p class="cap">Edit every word of the site in all three languages. Clear a box to restore the default.</p>${R.map(r=>`<div style="margin-bottom:12px"><b>${r[0]}</b><div class="two">${LG.map(l=>`<textarea rows="2" data-k="${r[0]}" data-l="${l}">${esc(S.set.tx?.[l]?.[r[0]]||D[l][r[0]])}</textarea>`).join('')}</div></div>`).join('')}<button class="btn" onclick="saveTx()">Save all texts</button>`},
design(){const s=S.set,F=(k,l)=>I('s_'+k,l,s[k]);return `<h3>Branding</h3><label>Website logo</label>${s.logo?`<img class="logo" src="${esc(s.logo)}" alt=""> `:''}<input id="s_logo" type="file" accept="image/*"><label>Home banner image (optional)</label><input id="s_hero" type="file" accept="image/*">
 <div class="two"><div>${I('s_color','Primary colour',s.color,'color')}</div><div>${I('s_gray','Secondary (gray) colour',s.gray,'color')}</div><div><label>Default language for new visitors</label><select id="s_lang">${[['en','English'],['hi','हिन्दी'],['or','ଓଡ଼ିଆ']].map(([a,b])=>`<option value="${a}" ${s.lang==a?'selected':''}>${b}</option>`).join('')}</select></div><div>${F('cats','Gallery categories (comma separated)')}</div></div>
 <h3>Contact & links</h3><div class="two"><div>${F('phone','Phone')}</div><div>${F('email','Email')}</div><div>${F('address','Address')}</div><div>${F('map','Google Maps link')}</div><div>${F('form','Google Form link')}</div><div>${F('fb','Facebook')}</div><div>${F('yt','YouTube')}</div><div>${F('wa','WhatsApp')}</div><div>${F('ig','Instagram')}</div></div><button class="btn" onclick="saveDes()">Save settings</button>`},
inq(){return `<h3>Inquiries (${S.inq.length})</h3>${lst(S.inq.map(x=>({...x,cid:'inquiries'})),x=>`<b>${esc(x.name)}</b> · ${esc(x.mobile)} <small class="h">${fmt(x.ts)}</small><br>${esc(x.msg)}`)}`},
data(){return `<h3>Import members (Excel / Google Sheet)</h3><p class="cap">In Excel or Google Sheets save as CSV with columns: <b>name, relation (father/husband), relation name, address, code</b> (code optional, auto-generated if empty). Then upload it here.</p><input id="csv" type="file" accept=".csv,text/csv"><button class="btn" onclick="impCsv()">Import CSV</button>
 <h3 style="margin-top:20px">Export</h3><button class="btn gr" onclick="expCsv('m')">Download members CSV</button> <button class="btn gr" onclick="expCsv('i')">Download inquiries CSV</button>
 <h3 style="margin-top:20px">Google Form</h3><p class="cap">Paste your Google Form link in <b>Design & Contact</b>; it shows as a button on the Contact page. Form responses → Google Sheet → Download CSV → import above.</p>`},
sec(){return `<h3>Change admin password</h3>${I('p0','Current password','','password')}${I('p1','New password (min 6 chars)','','password')}${I('p2','Confirm new password','','password')}<button class="btn" onclick="chPw()">Update password</button>`}};
const gen=()=>{let c;do c=String(1000+Math.floor(Math.random()*9000));while(S.members.some(x=>x.code==c));return c};
async function saveMem(){const o={name:g('mn'),relType:g('mt'),rel:g('mr'),address:g('ma'),code:g('mc')};if(!o.name||!/^\d{4}$/.test(o.code))return toast('Name and a 4-digit code are required');
 if(S.members.some(x=>x.code==o.code&&x.id!=eid))return toast('Code already used');const f=$('#mp').files[0],old=S.members.find(x=>x.id==eid);
 try{o.photo=f?await up(f):(old?.photo||'');const c=db.collection('members');eid?await c.doc(eid).set(o):await c.add(o);eid=null;toast('Saved');render()}catch(e){toast('Save failed')}}
async function saveNews(){const o={ts:S.news.find(x=>x.id==eid)?.ts||new Date().toISOString()};RD('nt','title',o);RD('nb','body',o);if(!o.title)return toast('Title required');
 const c=db.collection('news');eid?await c.doc(eid).set(o):await c.add(o);eid=null;toast('Published');render()}
async function saveGal(){const fs=[...$('#gf').files];if(!fs.length)return toast('Choose photos');try{for(const f of fs){const o={url:await up(f),cat:g('gc'),ts:new Date().toISOString()};RD('gp','cap',o);await db.collection('gallery').add(o)}toast('Uploaded')}catch(e){toast('Upload failed')}}
async function saveL(){const o={...(S.set.leaders[eid]||{})};RD('ln','name',o);RD('lr','role',o);RD('lm','msg',o);const f=$('#lp').files[0];if(f)o.photo=await up(f);const a=[...S.set.leaders];eid!=null?a[eid]=o:a.push(o);await saveSet({leaders:a});eid=null;toast('Saved');render()}
async function delL(i){if(!confirm('Delete?'))return;await saveSet({leaders:S.set.leaders.filter((_,j)=>j!=i)});render()}
async function saveTx(){const tx={en:{},hi:{},or:{}};document.querySelectorAll('[data-k]').forEach(a=>{const k=a.dataset.k,l=a.dataset.l,v=a.value.trim();if(v&&v!==D[l][k])tx[l][k]=v});await saveSet({tx});toast('Texts saved')}
async function saveDes(){const p={};['color','gray','lang','cats','phone','email','address','map','form','fb','yt','wa','ig'].forEach(k=>p[k]=g('s_'+k));
 try{for(const k of['logo','hero']){const f=$('#s_'+k).files[0];if(f)p[k]=await up(f)}await saveSet(p);toast('Settings saved');render()}catch(e){toast('Save failed')}}
async function chPw(){const d=await db.doc('secure/admin').get();const cur=d.exists?d.data().h:await sha('admin123');
 if(await sha(g('p0'))!=cur)return toast('Current password is wrong');if(g('p1').length<6||g('p1')!=g('p2'))return toast('New passwords must match (min 6 chars)');
 await db.doc('secure/admin').set({h:await sha(g('p1'))});toast('Password changed')}
function parse(tx){const rows=[];let r=[],c='',q=false;for(let i=0;i<tx.length;i++){const ch=tx[i];if(q){if(ch=='"'&&tx[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&tx[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(y=>y.trim()))}
async function impCsv(){const f=$('#csv').files[0];if(!f)return toast('Choose a CSV file');const rows=parse(await f.text());if(/name/i.test(rows[0]?.[0]))rows.shift();let n=0;const used=new Set(S.members.map(x=>x.code));
 for(const x of rows){let code=(x[4]||'').trim();if(!/^\d{4}$/.test(code)||used.has(code)){do code=String(1000+Math.floor(Math.random()*9000));while(used.has(code))}used.add(code);
  await db.collection('members').add({name:(x[0]||'').trim(),relType:/husband|पति|ସ୍ୱାମୀ/i.test(x[1]||'')?'husband':'father',rel:(x[2]||'').trim(),address:(x[3]||'').trim(),code,photo:''});n++}toast(n+' members imported')}
async function expCsv(w){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const csv=w=='m'?'name,relation,relation name,address,code\n'+S.members.map(x=>[x.name,x.relType,x.rel,x.address,x.code].map(q).join(',')).join('\n'):'name,mobile,message,date\n'+S.inq.map(x=>[x.name,x.mobile,x.msg,x.ts].map(q).join(',')).join('\n');
 const dl=await claude.use('downloads');if(dl)try{await dl.save({filename:(w=='m'?'members':'inquiries')+'.csv',data:csv})}catch(e){}else toast('Download unavailable')}
/* ---------- INIT ---------- */
const list=(c,k)=>db.collection(c).onSnapshot(s=>{S[k]=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.ts||'')>(a.ts||'')?1:-1);render()});
(async()=>{render();try{db=await claude.use('db');usr=await claude.use('user')}catch(e){}
 if(!db){$('#app').insertAdjacentHTML('afterbegin','<p class="err">Live data is unavailable in this view. Please sign in to claude.ai and reopen.</p>');return}
 ed=!!(usr&&usr.canEdit());
 db.doc('site/main').onSnapshot(s=>{S.set={...DEF,...(s.data()||{})};if(!CH)L=S.set.lang||'en';render()},()=>{});
 list('news','news');list('gallery','gal');if(ed){db.collection('members').onSnapshot(s=>{S.members=s.docs.map(d=>({...d.data(),id:d.id}));render()});list('inquiries','inq')}
 if(!L)L='en';render()})();
</script></body></html>
